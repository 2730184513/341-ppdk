include:
  - compose.database.yaml

services:
  backend:
    image: eclipse-temurin:21-jdk@sha256:ebfbb18d11ff163ee83b21258acf12248af48d22a0fdfdc68fa1a1516c05976a
    command: ["java", "-jar", "/opt/ppdk/app.jar"]
    working_dir: /opt/ppdk
    user: "65532:65532"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev,db
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8091"
      SERVER_SSL_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/ppdk_learning_dev
      DB_USER: ppdk_dev
      DB_PASSWORD: ${DB_PASSWORD:-341-ppdK}
      PPDK_HTTP_ORIGIN: ${PPDK_SITE:-https://localhost}
      PPDK_SEED_IDENTITY: "true"
      PPDK_SEED_CONTENT: "true"
      PPDK_DEMO_PASSWORD_A: ${PPDK_DEMO_PASSWORD_A:-341-ppdK}
      PPDK_DEMO_PASSWORD_B: ${PPDK_DEMO_PASSWORD_B:-341-ppdK}
      LOGGING_LEVEL_EDU_USM_PPDK: INFO
    volumes:
      - ./backend/runtime/app.jar:/opt/ppdk/app.jar:ro
    restart: unless-stopped

  demo-init:
    image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    profiles: ["setup"]
    depends_on:
      - backend
    command: ["flock", "-n", "/state/seed.lock", "node", "/init/seed.mjs"]
    environment:
      PPDK_SITE: ${PPDK_SITE:-https://localhost}
      PPDK_DEMO_PASSWORD_A: ${PPDK_DEMO_PASSWORD_A:-341-ppdK}
      PPDK_DEMO_PASSWORD_B: ${PPDK_DEMO_PASSWORD_B:-341-ppdK}
    volumes:
      - ./demo-init:/init:ro
      - demo-state:/state
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  gateway:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on:
      - backend
    environment:
      PPDK_SITE: ${PPDK_SITE:-https://localhost}
    ports:
      - "${PPDK_BIND_ADDRESS:-127.0.0.1}:${PPDK_HTTP_PORT:-80}:80"
      - "${PPDK_BIND_ADDRESS:-127.0.0.1}:${PPDK_HTTPS_PORT:-443}:${PPDK_HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/site:/srv/ppdk:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  demo-state:
  caddy-data:
  caddy-config:
