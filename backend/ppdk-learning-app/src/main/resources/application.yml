spring:
  application:
    name: ppdk-learning
  profiles:
    default: dev
  flyway:
    enabled: false
  task:
    execution:
      thread-name-prefix: "ppdk-learning-task-"
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 1000
        keep-alive: 60s
      shutdown:
        await-termination: true
        await-termination-period: 30s
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8091}
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
---
spring:
  config:
    activate:
      on-profile: "!db"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
